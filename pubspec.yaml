name: dishflow_delivery
description: DishFlow Delivery — white-label driver app (Phase 4).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3
  go_router: ^14.8.1
  dio: ^5.8.0+1
  fpdart: ^1.1.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  logger: ^2.5.0
  google_fonts: ^6.2.1
  connectivity_plus: ^6.1.4
  geolocator: ^13.0.1
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  google_maps_flutter: ^2.10.1
  flutter_svg: ^2.0.17
  url_launcher: ^6.3.1
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

# Launcher icon + native launch screen are generated from the ACTIVE brand
# assets, which `scripts/apply_brand.ps1 <brand>` fills in per branch.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: brand_assets/active/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: brand_assets/active/icon.png

flutter_native_splash:
  color: "#FFFFFF"
  image: brand_assets/active/splash.png
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    image: brand_assets/active/splash.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - brand_assets/active/icon.png
  fonts:
    - family: Urbanist-Regular
      fonts:
        - asset: assets/fonts/Urbanist-Regular.ttf
    - family: Urbanist-Medium
      fonts:
        - asset: assets/fonts/Urbanist-Medium.ttf
    - family: Urbanist-SemiBold
      fonts:
        - asset: assets/fonts/Urbanist-SemiBold.ttf
    - family: Urbanist-Bold
      fonts:
        - asset: assets/fonts/Urbanist-Bold.ttf
